<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <title>FX – {{ code }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    .wrap { max-width: 900px; }
  </style>
</head>
<body>
  <div class="wrap">
    <p><a href="/">← zpět</a></p>
    <h1>{{ code }} – vývoj kurzu</h1>
    <p>Graf ukazuje <strong>CZK za 1 {{ code }}</strong>.</p>

    <canvas id="chart" height="120"></canvas>
  </div>

  <script>
    async function load() {
      const res = await fetch(`/api/rates/{{ code }}`);
      const payload = await res.json();

      const labels = payload.data.map(x => x.date);
      const values = payload.data.map(x => x.czk_per_1);

      const ctx = document.getElementById("chart").getContext("2d");
      new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: `CZK za 1 ${payload.code}`,
            data: values,
            tension: 0.15
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: { beginAtZero: false }
          }
        }
      });
    }
    load();
  </script>
</body>
</html>
